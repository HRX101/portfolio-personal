<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04050d" />
    <meta name="robots" content="noindex, follow" />
    <title>Off the track — Hrithik Paul</title>
    <meta
      name="description"
      content="This page rode off the track. Head back to Hrithik Paul's portfolio."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, #134e4a 0%, transparent 70%),
          radial-gradient(ellipse 60% 40% at 80% 20%, #2e1065 0%, transparent 60%),
          linear-gradient(180deg, #04050d 0%, #07081a 50%, #04050d 100%);
        color: #eef1ff;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
      }
      svg {
        color: #45f0e0;
        opacity: 0.85;
        filter: drop-shadow(0 0 16px #45f0e0);
      }
      .code {
        margin: 1.5rem 0 0.25rem;
        font-family: ui-monospace, 'SF Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #45f0e0;
      }
      h1 {
        margin: 0.25rem 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      p {
        margin: 0 0 2rem;
        color: #a9b1d4;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        min-height: 44px;
        line-height: 44px;
        padding: 0 1.5rem;
        border-radius: 9999px;
        background: #45f0e0;
        color: #04050d;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #45f0e0;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        width="120"
        height="60"
        viewBox="0 0 64 32"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <path d="M8 20h8M16 20h8M24 20h8M32 20h8M40 20h8M48 20h8M56 20h8" stroke-linecap="round" />
        <circle cx="12" cy="24" r="4" />
        <circle cx="44" cy="24" r="4" />
        <path d="M8 20 L12 16 L20 16 L24 20" stroke-linejoin="round" />
        <path d="M40 20 L44 16 L52 16 L56 20" stroke-linejoin="round" />
      </svg>
      <p class="code">Error 404</p>
      <h1>Off the track</h1>
      <p>
        This station does not exist — the page moved, or the address never led
        anywhere. The portfolio itself is one turn back.
      </p>
      <a href="/">Back to the start</a>
    </main>
  </body>
</html>
